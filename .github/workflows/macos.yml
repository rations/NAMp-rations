# macOS build and gates.
#
# WHY CI AND NOT A CROSS BUILD. The rest of this project is built on one Linux
# box, Windows included: MinGW cross-compiles it and Wine runs every gate on it,
# so a Windows regression is caught on the machine that caused it. macOS has no
# equivalent to either half. Cross-compiling to Darwin is possible with osxcross,
# but it needs a macOS SDK extracted from Xcode -- which Apple licenses for use
# on Apple hardware only -- and, decisively, nothing built that way could be RUN:
# there is no Wine for Darwin. A macOS runner gives a native toolchain, a
# licensed SDK, and a place where the validator and panelrender actually execute.
#
# TWO RUNNERS, ONE SLICE EACH, JOINED BY LIPO LATER. A single arm64 runner can
# compile an x86_64 slice, but it cannot run that slice's gates without assuming
# Rosetta 2 is installed -- so every proof would silently only ever cover one
# architecture. Each slice is therefore built and gated on a host of its own
# architecture, and only already-proven binaries are joined.
#
# WHAT THIS DOES NOT COVER, and it is a large gap rather than a small one: every
# capture-dependent proof (rations_offline, ir-gate.sh, rations_switchcheck, most
# of rations_midicheck) needs .nam banks, and the plug-in ships none because the
# captures are not ours to distribute. The macOS DSP path is therefore unmeasured.
# See CLAUDE.md's flagged gap and the fixture-generator phase that closes it.
name: macOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both slices always run to completion: when one architecture fails and
      # the other does not, that difference IS the finding, and cancelling the
      # sibling would throw it away.
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon. The x86_64 label is the volatile one:
          # GitHub retires macOS images on a rolling schedule and the Intel
          # label has moved before (macos-12 went, macos-13 was put on a
          # deprecation path, and macos-15-intel exists as a replacement). If
          # the x86_64 job fails immediately with an unresolvable runner label,
          # that is what happened -- change the label here, nothing else.
          #
          # fail-fast is off partly for this: a dead Intel label must not stop
          # the arm64 slice from building and reporting.
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # The SDK is a superproject and only four of its submodules are needed;
      # `submodules: recursive` on the checkout action would additionally pull
      # vstgui4, doc and tutorials, none of which this project builds. Same
      # sequence CLAUDE.md documents for a local clone.
      - name: Submodules
        run: |
          git submodule update --init --recursive \
              NeuralAmpModelerCore AudioDSPTools eigen
          git submodule update --init vst3sdk
          git -C vst3sdk submodule update --init base cmake pluginterfaces public.sdk

      # Installed one at a time and only when absent. GitHub's images already
      # carry some of these, and `brew install` on a formula that is present but
      # outdated can decide to upgrade it and fail on a linking conflict with
      # something else preinstalled -- which would break the build for a reason
      # having nothing to do with this project.
      - name: Build tools
        run: |
          for f in meson ninja pkg-config; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
          cmake --version; meson --version; ninja --version

      # Keyed on the script rather than on a version string: every pin lives in
      # that file, so a changed pin is a changed hash and a rebuilt sysroot.
      - name: Cache the dependency sysroot
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ~/third_party/mac-deps
          key: macdeps-${{ matrix.arch }}-${{ hashFiles('scripts/build-mac-deps.sh') }}

      # Run unconditionally, cache hit or not: the script is idempotent through
      # per-module stamp files that live inside the cached tree, so on a hit it
      # is a fast no-op that still prints the sysroot roll-call and still fails
      # if a cached tree is incomplete or has acquired a dylib. Gating it on
      # cache-miss would mean a corrupt cache is discovered at link time.
      - name: Dependency sysroot (static cairo/freetype/pixman/png/zlib)
        run: scripts/build-mac-deps.sh
        env:
          RATIONS_MAC_ARCH: ${{ matrix.arch }}

      # PKG_CONFIG_LIBDIR points at our sysroot and NOTHING else, which is what
      # keeps Homebrew's dylibs out of the link. Without it pkg_check_modules
      # would happily find /opt/homebrew's cairo and produce a bundle that loads
      # on this runner and on no user's machine.
      #
      # Set inside the script rather than in an `env:` block because it has to
      # expand $HOME, and an `env:` value is an Actions expression in which
      # $HOME is literal text.
      - name: Configure
        run: |
          export PKG_CONFIG_LIBDIR="$HOME/third_party/mac-deps/${{ matrix.arch }}/sysroot/lib/pkgconfig"
          export PKG_CONFIG_PATH=""
          test -d "$PKG_CONFIG_LIBDIR" || { echo "no sysroot at $PKG_CONFIG_LIBDIR" >&2; exit 1; }
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      # Everything: the bundle, the SDK's validator and moduleinfotool, and every
      # offline tool. rations_jackcheck and rations_rtcheck are Linux-gated in
      # CMakeLists.txt and are simply absent here.
      - name: Build
        run: cmake --build build --parallel

      # panelrender is the first gate on a new platform for the same reason it was
      # on Windows: it proves cairo, FreeType, PNG decode, NanoSVG and the whole of
      # src/gfx before any window code exists, and it audits every art asset and
      # every legend against geometry.h while it does so.
      - name: Render and audit the editor pages
        run: |
          mkdir -p panels
          ./build/panelrender panels/mac resources 1.0

      # moduleinfo.json is generated for us: SMTG_CREATE_MODULE_INFO defaults ON
      # and its POST_BUILD step runs a natively-built moduleinfotool, which is why
      # this needs none of the explicit generation makedist-windows.sh does under
      # Wine. Asserted rather than assumed, because a silent failure there would
      # leave the bundle valid and the file missing.
      - name: moduleinfo.json
        run: |
          BUNDLE=build/VST3/Release/NAMp-rations.vst3
          test -s "$BUNDLE/Contents/Resources/moduleinfo.json" \
            || { echo "no moduleinfo.json in the bundle" >&2; exit 1; }
          head -c 200 "$BUNDLE/Contents/Resources/moduleinfo.json"; echo

      # A green validator is a FLOOR, never a gate -- three separate things in this
      # project have been wrong while it passed all 47 tests. It is run because it
      # is cheap and catches gross breakage, not because it settles anything.
      - name: SDK validator
        run: |
          BUNDLE=build/VST3/Release/NAMp-rations.vst3
          VALIDATOR=build/bin/Release/validator
          test -x "$VALIDATOR" || VALIDATOR=build/bin/validator
          OUT="$("$VALIDATOR" "$BUNDLE" 2>&1 || true)"
          echo "$OUT"
          echo "$OUT" | grep -qE '^Result: [0-9]+ tests passed, 0 tests failed' \
            || { echo "the SDK validator did not pass" >&2; exit 1; }

      # The mirror of makedist-windows.sh's objdump export gate. A VST3 bundle
      # offers exactly three entry points; anything else in the dynamic table is a
      # symbol two SDK versions in one host could interpose on each other.
      #
      # nm -gU: global (-g) and defined here (-U), so undefined imports are not
      # counted. The leading underscore is the Mach-O C symbol prefix.
      - name: Exports are exactly the three VST3 entry points
        run: |
          BIN=build/VST3/Release/NAMp-rations.vst3/Contents/MacOS/NAMp-rations
          GOT="$(nm -gU "$BIN" | awk '{print $3}' | sort | tr '\n' ' ')"
          echo "exports: $GOT"
          test "$GOT" = "_GetPluginFactory _bundleEntry _bundleExit " \
            || { echo "unexpected exported symbols" >&2; exit 1; }

      # The mirror of the imports gate, and the thing that proves the static
      # sysroot was actually linked: a bundle that names /opt/homebrew loads on
      # this runner and on nobody else's machine.
      - name: Links nothing but system libraries
        run: |
          BIN=build/VST3/Release/NAMp-rations.vst3/Contents/MacOS/NAMp-rations
          otool -L "$BIN"
          BAD="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
                 | grep -vE '^(/usr/lib/|/System/Library/Frameworks/)' || true)"
          test -z "$BAD" || { echo "non-system dependencies:"; echo "$BAD"; exit 1; }

      # The same four both makedist scripts assert. A bundle that loads and then
      # draws flat rectangles is a worse failure than one that does not load.
      - name: Load-bearing resources are in the bundle
        run: |
          RES=build/VST3/Release/NAMp-rations.vst3/Contents/Resources
          for f in img/head.png img/File.svg \
                   fonts/Michroma-Regular.ttf fonts/Roboto-Regular.ttf; do
            test -s "$RES/$f" || { echo "missing $f" >&2; exit 1; }
          done
          echo "all four present"

      # The one proof in this tree that needs no captures -- a pedal is the same
      # arithmetic whatever is upstream of it -- and so the only DSP measurement
      # macOS gets at all until the fixture generator exists. Every other offline
      # proof takes .nam banks that are not ours to ship.
      #
      # rations_racecheck is NOT run here despite being listed in the port plan:
      # it takes capture directories as positional arguments, so CI has nothing to
      # give it. Corrected by reading the tool, not by running it.
      - name: rations_pedalcheck
        run: ./build/rations_pedalcheck

      # Uploaded so the pages can be LOOKED AT. Three of the defects this
      # project's art has produced were invisible to every audit and visible
      # immediately in the render.
      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: panels-${{ matrix.arch }}
          path: panels/*.png
          if-no-files-found: error

      # The slice itself, for the universal join. Note what is NOT here: the SDK
      # ad-hoc-signs only moduleinfo.json under a Ninja build -- smtg_target_codesign
      # is entirely inside an if(XCODE) branch -- so the bundle carries no
      # _CodeSignature of its own. The linker's own default ad-hoc signature is what
      # makes the arm64 slice executable at all; signing the assembled bundle is the
      # packaging phase's job.
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: build/VST3/Release/NAMp-rations.vst3
          if-no-files-found: error
